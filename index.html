<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>台股分析助手 V0.2</title><style>
:root{--bg:#0b0f14;--card:#121923;--muted:#8e9aaa;--line:#263140;--green:#35d07f;--red:#ff6577;--blue:#6da8ff;--text:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px 60px}.top{display:flex;gap:10px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);padding:8px 0 16px;z-index:5}input{flex:1;border:1px solid var(--line);background:#101722;color:white;border-radius:14px;padding:14px;font-size:16px}button{border:0;border-radius:14px;padding:0 18px;font-weight:700;background:var(--blue);color:#07101e}.hero,.card{background:var(--card);border:1px solid #1d2733;border-radius:20px;padding:18px;margin-bottom:12px}.symbol,.muted{color:var(--muted);font-size:13px}h1{font-size:23px;margin:4px 0 12px}.price{font-size:36px;font-weight:800}.up{color:var(--red)}.down{color:var(--green)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{background:#182230;border-radius:999px;padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric b{font-size:20px;display:block;margin-top:5px}.level{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.level:last-child{border:0}.support{color:var(--green)}.resist{color:var(--red)}canvas{width:100%;height:360px;background:#0d131c;border-radius:14px;display:block}.bar{height:7px;background:#202b39;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--blue)}h2{font-size:17px;margin:0 0 12px}.status{padding:10px 12px;border-radius:12px;background:#182230;margin-bottom:12px;font-size:13px}.foot{text-align:center;color:#6f7c8d;font-size:12px;margin-top:22px}@media(max-width:520px){.grid{grid-template-columns:1fr}.price{font-size:32px}canvas{height:320px}.level>b{text-align:right}}
</style></head><body><main class="app"><div class="top"><input id="ticker" value="2330" inputmode="numeric" placeholder="輸入台股代號，例如 2330"><button id="go">分析</button></div>
<div id="status" class="status">準備載入真實行情…</div>
<section class="hero"><div class="symbol" id="sym">2330 · Taiwan</div><h1 id="name">2330</h1><div><span class="price" id="price">--</span> <span id="chg">--</span></div><div class="muted" id="date">FinMind 日資料 · V0.2</div><div class="chips"><span class="chip" id="trend">趨勢 --</span><span class="chip" id="rsiChip">RSI --</span><span class="chip" id="macdChip">MACD --</span><span class="chip" id="volChip">量能 --</span></div></section>
<section class="card"><h2>日 K · MA5 / MA20 / MA60 · 支撐壓力</h2><canvas id="chart" width="860" height="360"></canvas><div class="muted" style="margin-top:8px">紅K＝上漲、綠K＝下跌；虛線為自動偵測支撐/壓力</div></section>
<div class="grid"><section class="card metric"><span class="muted">RSI (14)</span><b id="rsi">--</b><div class="bar"><div class="fill" id="rsiBar" style="width:0"></div></div></section><section class="card metric"><span class="muted">MACD (12,26,9)</span><b id="macd">--</b><span class="muted" id="macdDetail">--</span></section></div>
<section class="card"><h2>支撐 / 壓力</h2><div id="levels"></div></section>
<section class="card"><h2>🤖 技術解讀</h2><div id="summary" style="line-height:1.75">載入資料後自動分析。</div></section>
<div class="foot">Stock Analyzer V0.2 · 資料來源 FinMind · 僅供研究，不構成投資建議</div></main>
<script>
const $=id=>document.getElementById(id); let DATA=[],LEVELS={supports:[],resists:[]};
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n)}
function ema(a,n){let k=2/(n+1),out=[],e=a[0];a.forEach((v,i)=>{e=i?v*k+e*(1-k):v;out.push(e)});return out}
function calcRSI(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];d>0?g+=d:l-=d}if(!l)return 100;let rs=(g/n)/(l/n);return 100-100/(1+rs)}
function clusterLevels(d,price){let piv=[];for(let i=3;i<d.length-3;i++){let hi=true,lo=true;for(let j=i-3;j<=i+3;j++){if(j===i)continue;if(d[j].max>=d[i].max)hi=false;if(d[j].min<=d[i].min)lo=false}if(hi)piv.push({p:d[i].max,type:'r',v:d[i].Trading_Volume});if(lo)piv.push({p:d[i].min,type:'s',v:d[i].Trading_Volume})}let tol=price*.012,groups=[];piv.forEach(x=>{let g=groups.find(g=>Math.abs(g.p-x.p)<=tol);if(g){g.items.push(x);g.p=g.items.reduce((s,z)=>s+z.p,0)/g.items.length}else groups.push({p:x.p,items:[x]})});groups.forEach(g=>g.score=g.items.length+Math.min(3,g.items.reduce((s,z)=>s+z.v,0)/(d.reduce((s,z)=>s+z.Trading_Volume,0)/d.length)/2));let s=groups.filter(g=>g.p<price).sort((a,b)=>(b.score-a.score)||b.p-a.p).slice(0,2).sort((a,b)=>b.p-a.p);let r=groups.filter(g=>g.p>price).sort((a,b)=>(b.score-a.score)||a.p-b.p).slice(0,2).sort((a,b)=>a.p-b.p);return {supports:s,resists:r}}
function fmt(v){return Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2})} function pct(v){return (v>=0?'+':'')+v.toFixed(2)+'%'}
async function load(){let t=$('ticker').value.trim();if(!/^\d{4,6}$/.test(t)){alert('請輸入台股代號');return}$('status').textContent='正在取得 '+t+' 真實日K…';$('go').disabled=true;try{let end=new Date(),start=new Date();start.setFullYear(end.getFullYear()-1);let ds=x=>x.toISOString().slice(0,10);let url=`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${encodeURIComponent(t)}&start_date=${ds(start)}&end_date=${ds(end)}`;let res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);let j=await res.json();if(j.status!==200||!j.data||j.data.length<60)throw new Error(j.msg||'資料不足');DATA=j.data.map(x=>({...x,open:+x.open,max:+x.max,min:+x.min,close:+x.close,Trading_Volume:+x.Trading_Volume}));render(t);$('status').textContent=`✓ 已載入 ${DATA.length} 個交易日真實資料（${DATA[0].date} ～ ${DATA.at(-1).date}）`;}catch(e){$('status').textContent='⚠️ 無法取得資料：'+e.message+'。若 GitHub Pages 被瀏覽器 CORS 擋住，下一版改用代理/API。';}finally{$('go').disabled=false}}
function render(t){let d=DATA,last=d.at(-1),prev=d.at(-2),cl=d.map(x=>x.close),m5=sma(cl,5),m20=sma(cl,20),m60=sma(cl,60),rsi=calcRSI(cl),e12=ema(cl,12),e26=ema(cl,26),ml=e12.map((v,i)=>v-e26[i]),sig=ema(ml,9),hist=ml.at(-1)-sig.at(-1),change=(last.close-prev.close)/prev.close*100;LEVELS=clusterLevels(d.slice(-180),last.close);$('sym').textContent=t+' · Taiwan';$('name').textContent=t;$('price').textContent=fmt(last.close);$('chg').textContent=(change>=0?'▲ ':'▼ ')+Math.abs(change).toFixed(2)+'%';$('chg').className=change>=0?'up':'down';$('date').textContent=`${last.date} 收盤 · 真實日資料`;let trend=last.close>m20.at(-1)&&(m20.at(-1)>m60.at(-1))?'偏多':last.close<m20.at(-1)&&(m20.at(-1)<m60.at(-1))?'偏空':'整理';$('trend').textContent='趨勢 '+trend;$('rsi').textContent=rsi.toFixed(1);$('rsiChip').textContent='RSI '+rsi.toFixed(0);$('rsiBar').style.width=Math.min(100,rsi)+'%';$('macd').textContent=hist>=0?'偏多':'偏空';$('macd').className=hist>=0?'resist':'support';$('macdChip').textContent='MACD '+(hist>=0?'▲':'▼');$('macdDetail').textContent=`MACD ${ml.at(-1).toFixed(2)} / Signal ${sig.at(-1).toFixed(2)}`;let av=d.slice(-20).reduce((s,x)=>s+x.Trading_Volume,0)/20,vr=last.Trading_Volume/av;$('volChip').textContent='量能 '+(vr>1.5?'放大':vr<.7?'萎縮':'正常');renderLevels(last.close);draw(d.slice(-120),m5.slice(-120),m20.slice(-120),m60.slice(-120));let s=LEVELS.supports[0],r=LEVELS.resists[0];$('summary').innerHTML=`目前趨勢為 <b>${trend}</b>，RSI ${rsi.toFixed(1)}，MACD 柱狀體${hist>=0?'為正':'為負'}。`+(s?`第一支撐約 <b>${fmt(s.p)}</b>（距現價 ${pct((s.p/last.close-1)*100)}）。`:'')+(r?`第一壓力約 <b>${fmt(r.p)}</b>（距現價 ${pct((r.p/last.close-1)*100)}）。`:'')+` 支撐壓力由近 180 個交易日 Pivot 高低點聚類計算，應視為區域而非單一精確價位。`}
function renderLevels(p){let html='';LEVELS.resists.forEach((x,i)=>{let w=p*.006;html+=`<div class="level"><div><b class="resist">第${i?'二':'一'}壓力</b><div class="muted">Pivot 聚類 · 強度 ${'★'.repeat(Math.min(5,Math.round(x.score)))}</div></div><b>${fmt(x.p-w)}～${fmt(x.p+w)}<div class="muted">${pct((x.p/p-1)*100)}</div></b></div>`});LEVELS.supports.forEach((x,i)=>{let w=p*.006;html+=`<div class="level"><div><b class="support">第${i?'二':'一'}支撐</b><div class="muted">Pivot 聚類 · 強度 ${'★'.repeat(Math.min(5,Math.round(x.score)))}</div></div><b>${fmt(x.p-w)}～${fmt(x.p+w)}<div class="muted">${pct((x.p/p-1)*100)}</div></b></div>`});$('levels').innerHTML=html||'<div class="muted">目前找不到足夠明顯的支撐壓力。</div>'}
function draw(d,m5,m20,m60){let c=$('chart'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);let vals=d.flatMap(x=>[x.max,x.min]);let extra=[...LEVELS.supports,...LEVELS.resists].map(x=>x.p);let mn=Math.min(...vals,...extra),mx=Math.max(...vals,...extra),pad=(mx-mn)*.08;mn-=pad;mx+=pad;let X=i=>35+i*(W-55)/(d.length-1),Y=v=>15+(mx-v)/(mx-mn)*(H-45);ctx.strokeStyle='#263140';ctx.lineWidth=1;for(let i=1;i<5;i++){let y=i*H/5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}let bw=Math.max(2,(W-55)/d.length*.55);d.forEach((z,i)=>{let x=X(i),up=z.close>=z.open;ctx.strokeStyle=up?'#ff6577':'#35d07f';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,Y(z.max));ctx.lineTo(x,Y(z.min));ctx.stroke();let y=Math.min(Y(z.open),Y(z.close)),h=Math.max(1,Math.abs(Y(z.open)-Y(z.close)));ctx.fillRect(x-bw/2,y,bw,h)});function line(a,col){ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();let started=false;a.forEach((v,i)=>{if(v==null)return;started?ctx.lineTo(X(i),Y(v)):(ctx.moveTo(X(i),Y(v)),started=true)});ctx.stroke()}line(m5,'#e8d66d');line(m20,'#6da8ff');line(m60,'#c58cff');ctx.setLineDash([7,5]);LEVELS.resists.forEach(x=>{ctx.strokeStyle='#ff6577';ctx.beginPath();ctx.moveTo(0,Y(x.p));ctx.lineTo(W,Y(x.p));ctx.stroke()});LEVELS.supports.forEach(x=>{ctx.strokeStyle='#35d07f';ctx.beginPath();ctx.moveTo(0,Y(x.p));ctx.lineTo(W,Y(x.p));ctx.stroke()});ctx.setLineDash([])}
$('go').onclick=load;$('ticker').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script></body></html>
